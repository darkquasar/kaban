[tools]
node = "22.23.4"
python = "3.12.16"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.150"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"

[settings]
locked_verify_provenance = true
node.compile = false
python.compile = false

# Rust is authoritative in the two rust-toolchain.toml files, not duplicated here.
[tasks.ci]
description = "Comprehensive gates including helpers; standalone producer is separate"
run = "bash scripts/ci/ci.sh"

[tasks.core]
description = "Quality, helpers, functional and PDF checks; no release builds"
run = "bash scripts/ci/ci.sh quality && bash scripts/ci/ci.sh helpers && bash scripts/ci/ci.sh functional && bash scripts/ci/ci.sh pdf"

[tasks.quality]
description = "Formatting, Clippy, deny and dependency boundaries"
run = "bash scripts/ci/ci.sh quality"

[tasks.helpers]
description = "Python helper tests and shell syntax"
run = "bash scripts/ci/ci.sh helpers"

[tasks.functional]
description = "Nextest suites and library doctests"
run = "bash scripts/ci/ci.sh functional"

[tasks.pdf]
description = "Full PDF-enabled ingest suite and doctest"
run = "bash scripts/ci/ci.sh pdf"

[tasks.macos]
description = "Focused native ARM64 macOS boundaries and public behavior"
run = "bash scripts/ci/ci.sh macos"

[tasks.producer]
description = "Standalone Rust SCIP producer under its own toolchain"
run = "bash scripts/ci/ci.sh producer"

[tasks.gnu]
description = "GNU release, smoke and size gates"
run = "bash scripts/ci/ci.sh gnu"

[tasks.musl]
description = "Native musl build and size gates"
run = "bash scripts/ci/ci.sh musl"
