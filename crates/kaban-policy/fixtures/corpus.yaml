# Denylist fixture corpus (core-plan.md §7, C1.2; extended by every later policy task).
# Table-driven: `tests/corpus.rs` compiles `policy` (builtin rules + the user terms below) and
# checks every case. `expect` is reject | redact | clean; `rules` lists rule ids that must appear.
# A case with `key` is a structured `key=value` leaf and goes through `scan_kv(key, text)`.
# A case with `document` (docs-ingest D6, DI1.4) is also fed to `kaban-ingest`'s `gate_document` as
# one chunk: `skip_file` must block the whole document, `stub` must stub only that chunk
# (checked by `crates/kaban-ingest/tests/canary.rs`).
# False-positive budget for the `clean` cases is 0. Values are invented test data.
policy:
  words:
    - { term: hunter2, action: redact, id: old-password }
  phrases:
    - { term: "Project Nightjar", id: codename-nightjar }
  rules:
    - id: internal-hostname
      description: internal hostnames must not be stored
      regex: '\b[a-z0-9-]+\.corp\.acme\.internal\b'
      keywords: [".corp.acme.internal"]
      action: redact
cases:
  # ---- document cases (D6 `on_document`): skip_file for private keys and .env-style assignments,
  #      stub for other reject-class shapes
  - { text: "DB_PASSWORD=Sup3rS3cretValue!", expect: reject, rules: [generic-credential-assignment], document: skip_file }
  - { text: "export API_KEY=Qx9vLm2pRt7wZk", expect: reject, rules: [generic-credential-assignment], document: skip_file }
  - { text: "-----BEGIN OPENSSH PRIVATE KEY-----\nb3BlbnNzaC1rZXk=", expect: reject, rules: [private-key-block], document: skip_file }
  - { text: "the key AKIAQWERTYUIOPASDFGH leaked in CI logs", expect: reject, rules: [aws-access-key-id], document: stub }
  - { text: "slack: xoxp-9876543210-ZYXWVUTSRQPO", expect: reject, rules: [slack-token], document: stub }
  - { text: "maps key AIzaSyA1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q", expect: reject, rules: [google-api-key], document: stub }
  # ---- positive cases (reject / redact)
