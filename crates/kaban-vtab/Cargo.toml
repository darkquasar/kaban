[package]
name = "kaban-vtab"
description = "kaban SQLite virtual-table glue for the unified query surface (scaffold, spec 11)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Process-level bootstrap of the virtual-table module. Inert scaffold until T12 owns the startup
# implementation; the CLI forwards its own `process-bootstrap` feature here.
process-bootstrap = []

[dependencies]
kaban-core.workspace = true
rusqlite = { workspace = true, features = ["vtab"] }

# The one crate allowed `unsafe` (QRY-07, OD-7; docs/developer/SAFETY.md). It does not inherit the
# workspace lint table (`[lints] workspace = false` is not valid Cargo, so the key is omitted) and
# restates every workspace lint except `unsafe_code`.
[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "allow"
too_many_lines = "allow"
