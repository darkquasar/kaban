# Every engine-spec §15.1 key spelled at its register default (engine-plan E1.1 config slice):
# loading this file equals `EngineConfig::default()` and `effective_overrides()` is empty.
ontology:
  pattern_size_limit_kib: 1024
  golden_strict: false
gazetteer:
  min_pattern_len: 3
  common_word_max_len: 4
  corpus_freq_cutoff: 0.05
  max_targets: 5
  max_automaton_mb: 25
  max_chunk_ms: 1
  v4_symbols: true
embed:
  model: null
  dtype: int8
  knn_k: 5
  tau:
    default: 0.80
  scan_window_rows: 4096
  max_scan_rss_mb: 32
  min_topk_overlap: 0.9
l3:
  holdout_min_f1: 0.50
  holdout_min_spans: 200
recall:
  fusion: rrf(60)
  rrf_k: 60
  judged_min_queries: 100
  column_weights:
    text: 1.0
    summary: 1.5
    tags: 1.0
    ident_terms: 2.0
ask:
  template_depth: 1
  template_depth_max: 3
ingest:
  finish_cap: 10000
  retention_days: 7
  metadata_allowance_kib: 4
  lru_entries: 4
  lru_mib: 8
  default_with: null
pipeline:
  retire_batch_rows: 1000
index:
  isolation: preferred
  container_image: null
  container_cli: null
  deadline_secs: 600
  quota:
    file_bytes: 1073741824
    run_dir_bytes: 4294967296
    tmp_bytes: 536870912
link:
  default: none
budget:
  l0_rss_mb: 64
bench:
  min_samples: 30
  why_regression_pct: 10
