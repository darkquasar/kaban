# E1.5 fixture (engine-plan E1.5 slices, engine-spec EN-F3/EN-F4): a user ontology whose
# `Runbook` carries a `rules` block with every value the service reads through the registry:
# `dedup: title+scope` (`remember` sets its dup key and reports candidate duplicates) and the
# display labels, plus a `props_schema` with an `enum` (`severity` outside `low|high` is
# `props.severity`). Stored name: `runbooks:Runbook`.
ontology: runbooks
version: 1
kinds:
  Runbook:
    description: "An operational procedure."
    props_schema: {"type": "object", "additionalProperties": false, "required": [], "properties": {"severity": {"type": "string", "enum": ["low", "high"]}, "steps": {"type": "array", "items": {"type": "string"}}}}
    rules: {display: {label: Runbook, plural: Runbooks}, dedup: title+scope}
rels: {}
