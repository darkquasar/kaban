# E1.4 fixture (engine-spec EN-F4 slices): a user ontology whose `Incident` and `Outage` carry a
# `rules` block, whose `Decision` deliberately has none (the negative: a shipped name in another
# namespace does not inherit the shipped rules), and whose `REPLACES` archives its target like
# `SUPERSEDES` (`on_link: archive_target`) while `MENTIONED_IN` has no side effect. Stored
# names: `incidents:Incident`, `incidents:REPLACES`, ...
ontology: incidents
version: 1
kinds:
  Incident:
    description: "A production incident."
    rules: {display: {label: Incident, plural: Incidents}, dedup: none}
  Outage:
    description: "An outage record kept in the store only."
    rules: {display: {label: Outage, plural: Outages}, dedup: none}
  Decision:
    description: "A decision taken during an incident (no rules block)."
rels:
  REPLACES: {from: [], to: [], directed: true, description: "A newer record replaces the target.", on_link: archive_target}
  MENTIONED_IN: {from: [], to: [], directed: true, description: "Mentioned in another record."}
