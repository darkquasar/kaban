name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# Only superseded PR runs cancel. Main/queue/manual candidates retain their results.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_STRIP: symbols
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  # Keep language tools namespace-visible; never restore executable tool caches.
  MISE_DATA_DIR: /opt/kaban-mise

jobs:
  selection:
    name: Select CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      producer: ${{ steps.scope.outputs.producer }}
      macos-producer: ${{ steps.scope.outputs.macos-producer }}
      cache-save: ${{ steps.scope.outputs.cache-save }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select producer and cache scope
        id: scope
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'SCOPE'
          import json, os, subprocess
          from pathlib import Path, PurePosixPath
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          name, ref = os.environ['GITHUB_EVENT_NAME'], os.environ['GITHUB_REF']
          # Proven documentation/metadata and helper-only changes omit Rust.
          # Build/setup, workflows, fixtures and unknown inputs keep all checks.
          selected, reason = True, 'shared or unknown impact'
          macos_producer = True
          base = (event.get('pull_request', {}).get('base', {}).get('sha') if name == 'pull_request'
                  else event.get('before') if name == 'push'
                  else event.get('merge_group', {}).get('base_sha') if name == 'merge_group' else None)
          if base and base != '0' * 40:
              diff = subprocess.run(['git', 'diff', '--no-ext-diff', '--no-textconv', '--no-renames', '--name-only', '-z', base, 'HEAD'],
                                    capture_output=True)
              if diff.returncode == 0:
                  paths = diff.stdout.decode('utf-8', errors='replace').split('\0')[:-1]
                  def documentation(path):
                      if path.startswith('licenses/release/'):
                          return True
                      if path == '.gitignore':
                          # Only the root machine-local instruction entry is
                          # metadata. Other ignore rules can affect test inputs.
                          edits = subprocess.run(['git', 'diff', '--no-ext-diff',
                              '--no-textconv', '--no-renames', '--unified=0', base,
                              'HEAD', '--', path], capture_output=True)
                          if edits.returncode != 0:
                              return False
                          hunk = False
                          for line in edits.stdout.split(b'\n'):
                              if line.startswith(b'@@ '):
                                  hunk = True
                              elif hunk and line[:1] in (b'+', b'-'):
                                  entry = line[1:]
                                  if entry not in (b'', b'/REPOLOCAL.md') and not entry.startswith(b'#'):
                                      return False
                          return hunk
                      if path == '.gitattributes':
                          # Attributes can also change checkout/build inputs. Only
                          # Linguist-only edits (including removals) are metadata.
                          # An unchanged macro can make a Linguist-named
                          # assignment expand into checkout-affecting attributes.
                          for revision in (base, 'HEAD'):
                              entries = subprocess.run(['git', 'ls-tree', '--name-only',
                                  revision, '--', path], capture_output=True)
                              if entries.returncode != 0:
                                  return False
                              if entries.stdout:
                                  content = subprocess.run(['git', 'show', f'{revision}:{path}'],
                                      capture_output=True)
                                  # Only simple ASCII syntax is eligible. Quoted
                                  # patterns can hide macros; Git treats a lone CR
                                  # as whitespace, unlike Python universal newlines.
                                  if content.returncode != 0 or any(
                                      byte not in (9, 10) and not 32 <= byte <= 126
                                      for byte in content.stdout) or any(
                                      line.lstrip(b' \t').startswith((b'[attr]', b'"'))
                                      for line in content.stdout.split(b'\n')):
                                      return False
                          attributes = subprocess.run(['git', 'diff', '--no-ext-diff',
                              '--no-textconv', '--unified=0', base, 'HEAD', '--', path],
                              capture_output=True)
                          if attributes.returncode != 0:
                              return False
                          hunk = False
                          allowed = {b'linguist-documentation', b'linguist-generated',
                              b'linguist-vendored', b'linguist-detectable', b'linguist-language'}
                          for line in attributes.stdout.split(b'\n'):
                              if line.startswith(b'@@ '):
                                  hunk = True
                              elif hunk and line[:1] in (b'+', b'-'):
                                  content = line[1:].strip()
                                  if not content or content.startswith(b'#'):
                                      continue
                                  fields = content.split()
                                  if (len(fields) < 2 or fields[0].startswith(b'[attr]') or
                                      any(a.lstrip(b'-!').split(b'=', 1)[0] not in allowed for a in fields[1:])):
                                      return False
                          return hunk
                      if path.startswith('docs/'):
                          return PurePosixPath(path).suffix.lower() in (
                              '.md', '.mdx', '.txt', '.rst', '.adoc',
                              '.png', '.jpg', '.jpeg', '.gif', '.svg', '.webp', '.ico')
                      return path in ('README.md', 'CHANGELOG.md', 'CODEBASE.md', 'AGENTS.md',
                          'CONTRIBUTING.md', 'SECURITY.md', 'CODE_OF_CONDUCT.md',
                          'LICENSE', 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE')
                  def helper_only(path):
                      file = PurePosixPath(path)
                      # These manual drivers and test harnesses are exercised by
                      # the always-running helper job, not by Rust job consumers.
                      if path in ('scripts/ci/clean-room.sh', 'scripts/dev/cargo-slot.sh',
                          'scripts/dev/lane-gate.sh', 'scripts/mcp/test_mcp_catalog.py',
                          'scripts/README.md', 'hooks/README.md', 'hooks/HOST-EVENTS.md',
                          'hooks/pi/README.md', 'tools/kaban-rust-scip/README.md'):
                          return True
                      if file.parent == PurePosixPath('scripts/tests') and file.suffix == '.py':
                          return True
                      # These paths separately select package validation on PRs.
                      # Authorization/notes execute on tags, not in PR packaging.
                      return (file.parent == PurePosixPath('scripts/release') and
                          file.name in ('authorize.py', 'build.sh', 'licenses.py',
                              'notes.py', 'package.py'))
                  if name != 'merge_group' and paths and all(documentation(p) or helper_only(p) for p in paths):
                      selected, reason = False, 'documentation/metadata/helper-only diff'
                  # Narrow producer/contract/setup inputs select qualification;
                  # known unrelated product trees omit it. Unknown paths select.
                  def producer_relevant(path):
                      if documentation(path) or helper_only(path):
                          return False
                      file = PurePosixPath(path)
                      if file.name in ('Cargo.toml', 'Cargo.lock', 'rust-toolchain',
                              'rust-toolchain.toml', 'build.rs', 'Makefile', 'CMakeLists.txt'):
                          return True
                      if path in ('mise.toml', 'mise.lock') or path.startswith((
                              'tools/kaban-rust-scip/', 'crates/kaban-core/',
                              'crates/kaban-index/', 'crates/kaban-codegraph/',
                              'crates/kaban/src/mcp/', 'crates/kaban/tests/common/',
                              'crates/kaban/tests/mcp_code', 'crates/kaban/tests/mcp_rust',
                              'crates/kaban/tests/code_smoke', 'crates/kaban/tests/serve_codegraph',
                              'crates/kaban/tests/acceptance_north_star',
                              'fixtures/codegraph/', 'scripts/ci/', '.cargo/', '.github/')):
                          return True
                      if path.startswith(('crates/kaban-ingest/', 'crates/kaban-store-sqlite/',
                              'crates/kaban-index-tantivy/', 'crates/kaban/src/cli/',
                              'hooks/', 'fixtures/ingest/', 'fixtures/walkthrough/', 'examples/')):
                          return False
                      if file.parent == PurePosixPath('crates/kaban/tests') and file.suffix == '.rs':
                          return False
                      return True
                  if paths:
                      macos_producer = any(producer_relevant(p) for p in paths)
          trusted = (name in ('push', 'workflow_dispatch') and
                     ref == 'refs/heads/' + os.environ['DEFAULT_BRANCH'])
          # GitHub scopes PR writes to the merge ref; default-branch entries
          # remain readable by PRs with the same compatible group key.
          pr = name == 'pull_request' and isinstance(event.get('number'), int)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'rust={str(selected).lower()}\nproducer={str(selected).lower()}\nmacos-producer={str(macos_producer).lower()}\ncache-save={str(trusted or pr).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f'Rust jobs and producer selected: {selected} ({reason}). Darwin producer qualification: {macos_producer}. Cache save permitted: {trusted or pr} (native ref scope).\n')
          SCOPE

  quality:
    name: Quality gates
    needs: selection
    if: ${{ needs.selection.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare tool directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" -m 755 "$MISE_DATA_DIR"
      - name: Install pinned tools (no executable cache)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.24
          cache: false
          install_args: --locked python aqua:EmbarkStudios/cargo-deny
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq
      - name: Prepare pinned Rust toolchain
        run: |
          # Read the owning toolchain file; do not replace it with an image default.
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc --version && cargo --version
      - name: Restore compatible Cargo dependencies
        id: cargo-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: ci-v1-quality
          workspaces: . -> target/ci-quality
          key: ${{ runner.os }}-${{ runner.arch }}-quality-${{ hashFiles('mise.toml', 'mise.lock', 'tools/kaban-rust-scip/rust-toolchain.toml') }}
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ needs.selection.outputs.cache-save }}
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Run quality checks
        env:
          KABAN_CI_ARTIFACT_DIR: ${{ runner.temp }}/ci-artifacts-quality
        run: bash scripts/ci/ci.sh quality
      - name: Resource and cache summary
        if: ${{ always() }}
        run: |
          {
            echo 'Group: quality; exact Cargo cache hit: ${{ steps.cargo-cache.outputs.cache-hit }}'
            echo 'Cache save permitted: ${{ needs.selection.outputs.cache-save }}; see action post-step for actual save.'
            free -h
            df -h . "$RUNNER_TEMP"
          } >> "$GITHUB_STEP_SUMMARY"

  functional:
    name: Functional gates
    needs: selection
    if: ${{ needs.selection.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-functional
      KABAN_CI_ISOLATION_SPLIT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare tool directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" -m 755 "$MISE_DATA_DIR"
      - name: Install pinned tools (no executable cache)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.24
          cache: false
          install_args: --locked python node aqua:nextest-rs/nextest/cargo-nextest
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sqlite3 strace
      - name: Prepare namespace-visible language tools
        run: |
          node_exe=$(mise which node)
          sudo chown root:root "$node_exe"
          sudo chmod go-w "$node_exe"
          sudo ln -sfn "$node_exe" /usr/bin/node
          stat -Lc 'Node executable: mode=%a uid=%u gid=%g' "$node_exe"
          go_root=$(sudo bash scripts/ci/install-go.sh /usr/lib/kaban-ci-go-1.26.0)
          scip_go=$(bash scripts/ci/install-scip-go.sh "$RUNNER_TEMP/kaban-ci-tools")
          echo "$go_root/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$go_root" >> "$GITHUB_ENV"
          echo "SCIP_GO=$scip_go" >> "$GITHUB_ENV"
          sudo ln -sfn "$go_root/bin/go" /usr/bin/go
          env -u GOROOT GOTOOLCHAIN=local /usr/bin/go version
      - name: Prepare pinned Rust toolchain
        run: |
          # Read the owning toolchain file; do not replace it with an image default.
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc --version && cargo --version
      - name: Restore compatible Cargo dependencies
        id: cargo-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: ci-v1-functional
          workspaces: . -> target/ci-functional
          key: ${{ runner.os }}-${{ runner.arch }}-functional-${{ hashFiles('mise.toml', 'mise.lock', 'tools/kaban-rust-scip/rust-toolchain.toml') }}
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ needs.selection.outputs.cache-save }}
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Run functional checks
        env:
          KABAN_CI_ARTIFACT_DIR: ${{ runner.temp }}/ci-artifacts-functional
        run: bash scripts/ci/ci.sh functional
      - name: Resource and cache summary
        if: ${{ always() }}
        run: |
          {
            echo 'Group: functional; exact Cargo cache hit: ${{ steps.cargo-cache.outputs.cache-hit }}'
            echo 'Cache save permitted: ${{ needs.selection.outputs.cache-save }}; see action post-step for actual save.'
            free -h
            df -h . "$RUNNER_TEMP"
          } >> "$GITHUB_STEP_SUMMARY"

