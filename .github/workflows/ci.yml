          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("tools/kaban-rust-scip/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          (cd tools/kaban-rust-scip && rustc --version && cargo --version)
      - name: Restore compatible Cargo dependencies
        id: cargo-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: ci-v1-producer
          workspaces: tools/kaban-rust-scip -> ../../target/ci-producer/producer
          key: ${{ runner.os }}-${{ runner.arch }}-producer-${{ hashFiles('mise.toml', 'mise.lock', 'tools/kaban-rust-scip/rust-toolchain.toml') }}
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ needs.selection.outputs.cache-save }}
      - name: Run producer checks
        env:
          KABAN_CI_ARTIFACT_DIR: ${{ runner.temp }}/ci-artifacts-producer
        run: bash scripts/ci/ci.sh producer
      - name: Resource and cache summary
        if: ${{ always() }}
        run: |
          {
            echo 'Group: producer; exact Cargo cache hit: ${{ steps.cargo-cache.outputs.cache-hit }}'
            echo 'Cache save permitted: ${{ needs.selection.outputs.cache-save }}; see action post-step for actual save.'
            free -h
            df -h . "$RUNNER_TEMP"
          } >> "$GITHUB_STEP_SUMMARY"

  macos:
    name: Native macOS gates
    needs: selection
    if: ${{ needs.selection.outputs.rust == 'true' }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-macos
      TMPDIR: /private/tmp
      KABAN_CARGO_SLOTS: "1"
      TOKIO_WORKER_THREADS: "2"
      KABAN_MACOS_PRODUCER_QUALIFY: ${{ needs.selection.outputs.macos-producer == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify native Mac runner and prepare private directories
        run: |
          export MISE_DATA_DIR="$RUNNER_TEMP/kaban-mise"
          export KABAN_HOME="$RUNNER_TEMP/kaban-home"
          printf 'MISE_DATA_DIR=%s\nKABAN_HOME=%s\n' "$MISE_DATA_DIR" "$KABAN_HOME" >> "$GITHUB_ENV"
          echo "KABAN_MACOS_SETUP_START=$(date +%s)" >> "$GITHUB_ENV"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$RUNNER_ARCH" = ARM64
          mkdir -m 700 "$MISE_DATA_DIR" "$KABAN_HOME"
          if [ "$KABAN_MACOS_PRODUCER_QUALIFY" = 1 ]; then
            # Hosted Xcode is runner-owned; admission requires root-owned Apple resources.
            if [ ! -d /Library/Developer/CommandLineTools ]; then
              echo 'not-run: installed Apple Command Line Tools absent; exit 3' >&2
              exit 3
            fi
            sudo /usr/bin/xcode-select --switch /Library/Developer/CommandLineTools
          fi
          {
            uname -a
            sw_vers
            xcode-select -p
            xcrun --show-sdk-version
            pkgutil --pkg-info com.apple.pkg.CLTools_Executables
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install pinned Mac tools (no executable cache)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.24
          cache: false
          install_args: --locked python node aqua:nextest-rs/nextest/cargo-nextest
      - name: Prepare pinned Mac Rust toolchains
        run: |
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal
          if [ "$KABAN_MACOS_PRODUCER_QUALIFY" = 1 ]; then
            producer_channel=$(python3 -c 'import tomllib; print(tomllib.load(open("tools/kaban-rust-scip/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
            rustup toolchain install "$producer_channel" --profile minimal --component rust-src --component rustfmt --component clippy
          fi
          rustc -vV
          cargo --version
          echo "Mac setup elapsed: $(($(date +%s) - KABAN_MACOS_SETUP_START))s" >> "$GITHUB_STEP_SUMMARY"
          echo "KABAN_MACOS_RESTORE_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Restore compatible Mac Cargo dependencies
        id: cargo-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: ci-v1-macos
          workspaces: |
            . -> target/ci-macos
            tools/kaban-rust-scip -> ../../target/ci-macos/producer
          key: ${{ runner.os }}-${{ runner.arch }}-macos-full-${{ hashFiles('mise.toml', 'mise.lock', 'rust-toolchain.toml', 'tools/kaban-rust-scip/rust-toolchain.toml', 'tools/kaban-rust-scip/Cargo.lock') }}
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ needs.selection.outputs.cache-save }}
      - name: Fetch Mac locked dependencies
        run: |
          echo "Mac dependency restore elapsed: $(($(date +%s) - KABAN_MACOS_RESTORE_START))s" >> "$GITHUB_STEP_SUMMARY"
          time cargo fetch --locked
      - name: Run focused native Mac checks
        run: bash scripts/dev/cargo-slot.sh bash scripts/ci/ci.sh macos
      - name: Mac resource and cache summary
        if: ${{ always() }}
        run: |
          {
            echo 'Group: macos; exact Cargo cache hit: ${{ steps.cargo-cache.outputs.cache-hit }}'
            echo 'Cache save permitted: ${{ needs.selection.outputs.cache-save }}; see action post-step for actual save.'
            echo 'Producer qualification selected: ${{ needs.selection.outputs.macos-producer }}; trusted none is not Linux namespace isolation.'
            sysctl -n hw.memsize
            vm_stat
            df -h . "$RUNNER_TEMP" /private/tmp
          } >> "$GITHUB_STEP_SUMMARY"

  script-tests:
    name: Helper script unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare tool directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" -m 755 "$MISE_DATA_DIR"
      - name: Install pinned helper Python
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.24
          cache: false
          install_args: --locked python
      - name: Run helper checks once
        run: bash scripts/ci/ci.sh helpers

  gates:
    name: Rust gates (scripts/ci/ci.sh)
    if: ${{ always() }}
    needs: [selection, quality, functional, pdf, gnu, musl, script-tests, producer, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Run gates
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'READINESS'
          import json, os, sys
          needs = json.loads(os.environ['NEEDS_JSON'])
          selected = needs.get('selection', {}).get('outputs', {}).get('producer')
          rust = needs.get('selection', {}).get('outputs', {}).get('rust')
          rust_jobs = ('quality', 'functional', 'pdf', 'gnu', 'musl', 'macos')
          failed = selected not in ('true', 'false') or rust not in ('true', 'false')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              for job in ('selection', 'quality', 'functional', 'pdf', 'gnu', 'musl', 'script-tests', 'producer', 'macos'):
                  result = needs.get(job, {}).get('result', 'missing')
                  omitted = (job == 'producer' and selected == 'false') or (job in rust_jobs and rust == 'false')
                  expected = 'skipped' if omitted else 'success'
                  out.write(f'{job}: {result} (required: {expected})\n')
                  failed |= result != expected
              out.write('Readiness: ' + ('FAILED' if failed else 'PASS') + '\n')
          sys.exit(1 if failed else 0)
          READINESS
