          } >> "$GITHUB_STEP_SUMMARY"

  musl:
    name: Musl gates
    needs: selection
    if: ${{ needs.selection.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-musl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare tool directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" -m 755 "$MISE_DATA_DIR"
      - name: Install pinned tools (no executable cache)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.24
          cache: false
          install_args: --locked python
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Prepare pinned Rust toolchain
        run: |
          # Read the owning toolchain file; do not replace it with an image default.
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain "$channel" "$(uname -m)-unknown-linux-musl"
          rustc --version && cargo --version
      - name: Restore compatible Cargo dependencies
        id: cargo-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: ci-v1-musl
          workspaces: . -> target/ci-musl
          key: ${{ runner.os }}-${{ runner.arch }}-musl-${{ hashFiles('mise.toml', 'mise.lock', 'tools/kaban-rust-scip/rust-toolchain.toml') }}
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ needs.selection.outputs.cache-save }}
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Run musl checks
        env:
          KABAN_CI_ARTIFACT_DIR: ${{ runner.temp }}/ci-artifacts-musl
        run: bash scripts/ci/ci.sh musl
      - name: Resource and cache summary
        if: ${{ always() }}
        run: |
          {
            echo 'Group: musl; exact Cargo cache hit: ${{ steps.cargo-cache.outputs.cache-hit }}'
            echo 'Cache save permitted: ${{ needs.selection.outputs.cache-save }}; see action post-step for actual save.'
            free -h
            df -h . "$RUNNER_TEMP"
          } >> "$GITHUB_STEP_SUMMARY"

  producer:
    name: Producer gates
    needs: selection
    if: ${{ needs.selection.outputs.producer == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-producer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare tool directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" -m 755 "$MISE_DATA_DIR"
      - name: Install pinned tools (no executable cache)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.24
          cache: false
          install_args: --locked python
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config
      - name: Prepare pinned Rust toolchain
        run: |
          # Read the owning toolchain file; do not replace it with an image default.
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("tools/kaban-rust-scip/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          (cd tools/kaban-rust-scip && rustc --version && cargo --version)
      - name: Restore compatible Cargo dependencies
        id: cargo-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: ci-v1-producer
          workspaces: tools/kaban-rust-scip -> ../../target/ci-producer/producer
          key: ${{ runner.os }}-${{ runner.arch }}-producer-${{ hashFiles('mise.toml', 'mise.lock', 'tools/kaban-rust-scip/rust-toolchain.toml') }}
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ needs.selection.outputs.cache-save }}
      - name: Run producer checks
        env:
          KABAN_CI_ARTIFACT_DIR: ${{ runner.temp }}/ci-artifacts-producer
        run: bash scripts/ci/ci.sh producer
      - name: Resource and cache summary
        if: ${{ always() }}
        run: |
          {
            echo 'Group: producer; exact Cargo cache hit: ${{ steps.cargo-cache.outputs.cache-hit }}'
            echo 'Cache save permitted: ${{ needs.selection.outputs.cache-save }}; see action post-step for actual save.'
            free -h
            df -h . "$RUNNER_TEMP"
          } >> "$GITHUB_STEP_SUMMARY"

  script-tests:
    name: Helper script unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare tool directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" -m 755 "$MISE_DATA_DIR"
      - name: Install pinned helper Python
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.24
          cache: false
          install_args: --locked python
      - name: Run helper checks once
        run: bash scripts/ci/ci.sh helpers

  gates:
    name: Rust gates (scripts/ci/ci.sh)
    if: ${{ always() }}
    needs: [selection, quality, functional, pdf, gnu, musl, script-tests, producer]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Run gates
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'READINESS'
          import json, os, sys
          needs = json.loads(os.environ['NEEDS_JSON'])
          selected = needs.get('selection', {}).get('outputs', {}).get('producer')
          rust = needs.get('selection', {}).get('outputs', {}).get('rust')
          rust_jobs = ('quality', 'functional', 'pdf', 'gnu', 'musl')
          failed = selected not in ('true', 'false') or rust not in ('true', 'false')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              for job in ('selection', 'quality', 'functional', 'pdf', 'gnu', 'musl', 'script-tests', 'producer'):
                  result = needs.get(job, {}).get('result', 'missing')
                  omitted = (job == 'producer' and selected == 'false') or (job in rust_jobs and rust == 'false')
                  expected = 'skipped' if omitted else 'success'
                  out.write(f'{job}: {result} (required: {expected})\n')
                  failed |= result != expected
              out.write('Readiness: ' + ('FAILED' if failed else 'PASS') + '\n')
          sys.exit(1 if failed else 0)
          READINESS
